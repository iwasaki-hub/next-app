# Temporary bootstrap to generate a reproducible npm lockfile on a networked runner.
# Remove this workflow after the lockfile is committed.
name: Generate E2E lockfile (temporary)
on:
  push:
    branches:
      - feature/ui-e2e-playwright
    paths:
      - package.json

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Resolve exact dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile on the feature branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Playwright browser-test dependencies"
          git push origin HEAD:refs/heads/feature/ui-e2e-playwright
