# Temporary bootstrap workflow; remove after package-lock.json is committed.
name: Generate npm lockfile

on:
  push:
    branches:
      - feature/lockfile-npm-ci

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Check generated lockfile
        run: |
          node -e 'const l=require("./package-lock.json");const p=require("./package.json");if(l.name!==p.name||l.lockfileVersion!==3){process.exit(1)};console.log("Verified npm lockfile v3, packages:",Object.keys(l.packages).length)'
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit generated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git commit -m "build: generate npm lockfile with Node 24"
          git push origin HEAD:refs/heads/feature/lockfile-npm-ci
